<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="setuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E25822" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#185240" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2B20" />
      <stop offset="100%" stop-color="#113D2F" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#236B54" stroke-width="2" />
  <!-- Outer Compass Ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#E25822" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.6" />
  <!-- Inner Sacred Geometry / Wheel Hub -->
  <circle cx="32" cy="32" r="6" fill="#0B2B20" stroke="#FF9E68" stroke-width="2" />
  <circle cx="32" cy="32" r="2.5" fill="#E25822" />
  <!-- Compass Needles (North/South/East/West) -->
  <!-- North Needle (Saffron) -->
  <polygon points="32,12 36,28 32,26" fill="#E25822" />
  <polygon points="32,12 28,28 32,26" fill="#FF8A4C" />
  <!-- South Needle (Emerald/Teal) -->
  <polygon points="32,52 36,36 32,38" fill="#A7C2B5" />
  <polygon points="32,52 28,36 32,38" fill="#E2EBE6" />
  <!-- East Needle -->
  <polygon points="52,32 36,36 38,32" fill="#E25822" opacity="0.8" />
  <!-- West Needle -->
  <polygon points="12,32 28,28 26,32" fill="#A7C2B5" opacity="0.8" />
</svg>
